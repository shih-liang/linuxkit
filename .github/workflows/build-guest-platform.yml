name: Build LinuxKit guest platform

on:
  push:
    tags:
      - "linuxkit-platform-v*"

permissions:
  contents: read

concurrency:
  group: linuxkit-platform-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and test guest platform
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY}" != "shih-liang/linuxkit" ]; then
            echo "Platform releases are only published from shih-liang/linuxkit." >&2
            exit 1
          fi
          version="$(tr -d '[:space:]' < guest-platform/guestd/VERSION)"
          tag="${GITHUB_REF_NAME}"
          prefix="linuxkit-platform-v${version}-"
          # This suffix is the cross-repository runtime setGeneration. The
          # host waits for a RemotePipe display release with the same value.
          case "$tag" in
            "${prefix}"*) sequence="${tag#"$prefix"}" ;;
            *)
              echo "Tag must begin with ${prefix}: ${tag}" >&2
              exit 1
              ;;
          esac
          case "$sequence" in
            ""|*[!0-9]*|0|0[0-9]*)
              echo "Release sequence must be a positive integer: ${sequence}" >&2
              exit 1
              ;;
          esac
          export LC_ALL=C
          decimal_gt() {
            if (( ${#1} != ${#2} )); then
              (( ${#1} > ${#2} ))
            else
              [[ "$1" > "$2" ]]
            fi
          }
          if decimal_gt "$sequence" 18446744073709551615; then
            echo "Release sequence exceeds UInt64: ${sequence}" >&2
            exit 1
          fi
          if [ "$tag" != "linuxkit-platform-v${version}-${sequence}" ]; then
            echo "Tag does not exactly match VERSION and sequence: ${tag}" >&2
            exit 1
          fi
          git fetch --force --tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag must point to a commit reachable from protected main." >&2
            exit 1
          fi
          maximum=0
          maximum_tag=
          while IFS= read -r previous_tag; do
            [ "$previous_tag" = "$tag" ] && continue
            if [[ "$previous_tag" =~ ^linuxkit-platform-v[0-9]+\.[0-9]+\.[0-9]+-([1-9][0-9]*)$ ]]; then
              previous_sequence="${BASH_REMATCH[1]}"
              if decimal_gt "$previous_sequence" 18446744073709551615; then
                continue
              fi
              if decimal_gt "$previous_sequence" "$maximum"; then
                maximum="$previous_sequence"
                maximum_tag="$previous_tag"
              fi
            fi
          done < <(git tag --list 'linuxkit-platform-v*')
          if ! decimal_gt "$sequence" "$maximum"; then
            echo "Release sequence ${sequence} is not greater than published sequence ${maximum}" >&2
            exit 1
          fi
          if [ -n "$maximum_tag" ]; then
            previous_commit=$(git rev-parse "refs/tags/$maximum_tag^{commit}")
            if ! git merge-base --is-ancestor "$previous_commit" "$GITHUB_SHA"; then
              echo "Release source must descend from the latest published release." >&2
              exit 1
            fi
          fi
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          {
            echo "PLATFORM_VERSION=${version}"
            echo "RELEASE_TAG=${tag}"
            echo "RELEASE_SEQUENCE=${sequence}"
            echo "SOURCE_DATE_EPOCH=${source_date_epoch}"
          } >> "$GITHUB_ENV"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Validate release license inventory
        run: python3 guest-platform/scripts/check-license-inventory.py

      - name: Run host unit tests
        run: make -C guest-platform test

      - name: Build static guest binaries
        run: make -C guest-platform build

      - name: Verify guest binary ABI
        shell: bash
        run: |
          set -euo pipefail
          version="${PLATFORM_VERSION}"
          for architecture in aarch64 x86_64; do
            for program in nativepipe-bootstrap nativepipe-guestd; do
              binary="guest-platform/build/${architecture}/${program}"
              test -x "$binary"
              headers="${RUNNER_TEMP}/${architecture}-${program}.program-headers"
              readelf --program-headers "$binary" > "$headers"
              if grep -q 'INTERP' "$headers"; then
                echo "Guest binary is dynamically linked: ${binary}" >&2
                exit 1
              fi
            done
          done
          readelf --file-header guest-platform/build/aarch64/nativepipe-guestd \
            > "${RUNNER_TEMP}/aarch64.file-header"
          readelf --file-header guest-platform/build/x86_64/nativepipe-guestd \
            > "${RUNNER_TEMP}/x86_64.file-header"
          grep -Eq 'Machine:[[:space:]]+AArch64' "${RUNNER_TEMP}/aarch64.file-header"
          grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64' \
            "${RUNNER_TEMP}/x86_64.file-header"
          strings guest-platform/build/aarch64/nativepipe-guestd \
            > "${RUNNER_TEMP}/aarch64.strings"
          strings guest-platform/build/x86_64/nativepipe-guestd \
            > "${RUNNER_TEMP}/x86_64.strings"
          grep -Fxq "NPGV:${version}" "${RUNNER_TEMP}/aarch64.strings"
          grep -Fxq "NPGV:${version}" "${RUNNER_TEMP}/x86_64.strings"

      - name: Validate installation adapters
        run: python3 adapters/validate.py

      - name: Verify signed guest environment catalog
        run: |
          python3 guest-platform/scripts/verify-environment-catalog.py \
            --resources Resources

      - name: Verify deterministic packaging
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          make -C guest-platform test-package \
            SOURCE_REPOSITORY="${GITHUB_REPOSITORY}" \
            SOURCE_COMMIT="${SOURCE_COMMIT}" \
            SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}"

      - name: Build release artifacts
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          make -C guest-platform package \
            RELEASE_TAG="${RELEASE_TAG}" \
            RELEASE_SEQUENCE="${RELEASE_SEQUENCE}" \
            SOURCE_REPOSITORY="${GITHUB_REPOSITORY}" \
            SOURCE_COMMIT="${SOURCE_COMMIT}" \
            SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}"

      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: lighthouse-guest-platform
          path: guest-platform/dist/*
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign verified guest platform
    needs: build
    permissions:
      contents: read
    uses: shih-liang/linuxkit/.github/workflows/sign-guest-platform.yml@main
    secrets:
      signing_key: ${{ secrets.LIGHTHOUSE_PLATFORM_ED25519_PRIVATE_KEY }}
    with:
      artifact_name: lighthouse-guest-platform
      release_tag: ${{ github.ref_name }}
      source_commit: ${{ github.sha }}

  publish:
    name: Publish signed guest platform
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out protected publication policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Download signed release candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: signed-lighthouse-guest-platform
          path: release

      - name: Verify signed artifact and trusted tag
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          EXPECTED_PUBLIC_KEY_BASE64: ${{ vars.LIGHTHOUSE_RUNTIME_ED25519_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "shih-liang/linuxkit"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^linuxkit-platform-v([0-9]+\.[0-9]+\.[0-9]+)-([1-9][0-9]*)$ ]]
          version=${BASH_REMATCH[1]}
          sequence=${BASH_REMATCH[2]}
          git fetch --force --tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_COMMIT"
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main
          export LC_ALL=C
          decimal_gt() {
            if (( ${#1} != ${#2} )); then
              (( ${#1} > ${#2} ))
            else
              [[ "$1" > "$2" ]]
            fi
          }
          highest=0
          highest_tag=
          while IFS= read -r previous_tag; do
            [[ "$previous_tag" == "$RELEASE_TAG" ]] && continue
            if [[ "$previous_tag" =~ ^linuxkit-platform-v[0-9]+\.[0-9]+\.[0-9]+-([1-9][0-9]*)$ ]]; then
              candidate=${BASH_REMATCH[1]}
              decimal_gt "$candidate" 18446744073709551615 && continue
              if decimal_gt "$candidate" "$highest"; then
                highest=$candidate
                highest_tag=$previous_tag
              fi
            fi
          done < <(git tag --list 'linuxkit-platform-v*')
          ! decimal_gt "$sequence" 18446744073709551615
          decimal_gt "$sequence" "$highest"
          if [[ -n "$highest_tag" ]]; then
            previous_commit=$(git rev-parse "refs/tags/$highest_tag^{commit}")
            git merge-base --is-ancestor "$previous_commit" "$SOURCE_COMMIT"
          fi
          test -n "${EXPECTED_PUBLIC_KEY_BASE64:-}"
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT HUP INT TERM
          printf '%s' "$EXPECTED_PUBLIC_KEY_BASE64" | base64 --decode \
            > "$key_dir/expected-public.raw"
          test "$(wc -c < "$key_dir/expected-public.raw" | tr -d '[:space:]')" -eq 32
          openssl pkey -pubin \
            -in release/linuxkit-platform-ed25519-public-key.pem \
            -outform DER -out "$key_dir/public.der"
          test "$(wc -c < "$key_dir/public.der" | tr -d '[:space:]')" -eq 44
          test "$(od -An -tx1 -N12 "$key_dir/public.der" | tr -d '[:space:]')" = \
            '302a300506032b6570032100'
          cmp "$key_dir/expected-public.raw" <(tail -c 32 "$key_dir/public.der")
          test -s release/SHA256SUMS
          test "$(wc -c < release/SHA256SUMS.sig | tr -d '[:space:]')" -eq 64
          (cd release && sha256sum --check --strict SHA256SUMS)
          openssl pkeyutl -verify -rawin -pubin \
            -inkey release/linuxkit-platform-ed25519-public-key.pem \
            -in release/SHA256SUMS -sigfile release/SHA256SUMS.sig
          manifest_count=0
          for manifest in release/*.runtime-manifest.json; do
            signature="${manifest%.json}.sig"
            test "$(wc -c < "$signature" | tr -d '[:space:]')" -eq 64
            openssl pkeyutl -verify -rawin -pubin \
              -inkey release/linuxkit-platform-ed25519-public-key.pem \
              -in "$manifest" -sigfile "$signature"
            manifest_count=$((manifest_count + 1))
          done
          test "$manifest_count" -eq 2
          {
            echo "version=$version"
            echo "sequence=$sequence"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists and will not be replaced: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --title "LightHouse Guest Platform ${{ steps.identity.outputs.version }}-${{ steps.identity.outputs.sequence }}" \
            --generate-notes
