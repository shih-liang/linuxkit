name: Sign LinuxKit guest platform

on:
  workflow_call:
    secrets:
      signing_key:
        required: true
    inputs:
      artifact_name:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      source_commit:
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    name: Verify trusted source and sign
    runs-on: ubuntu-24.04
    environment: platform-release
    permissions:
      contents: read
    steps:
      - name: Check out protected release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Prove the release tag points into protected main
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "shih-liang/linuxkit"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source commit is not a full lowercase Git object ID" >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^linuxkit-platform-v([0-9]+\.[0-9]+\.[0-9]+)-([1-9][0-9]*)$ ]] || {
            echo "invalid platform release tag: $RELEASE_TAG" >&2
            exit 1
          }
          version=${BASH_REMATCH[1]}
          sequence=${BASH_REMATCH[2]}
          git fetch --force --tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$tag_commit" = "$SOURCE_COMMIT"
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main; then
            echo "release tag must point to a commit reachable from protected main" >&2
            exit 1
          fi
          export LC_ALL=C
          decimal_gt() {
            if (( ${#1} != ${#2} )); then
              (( ${#1} > ${#2} ))
            else
              [[ "$1" > "$2" ]]
            fi
          }
          if decimal_gt "$sequence" 18446744073709551615; then
            echo "release sequence exceeds UInt64" >&2
            exit 1
          fi
          highest=0
          highest_tag=
          while IFS= read -r previous_tag; do
            [[ "$previous_tag" == "$RELEASE_TAG" ]] && continue
            if [[ "$previous_tag" =~ ^linuxkit-platform-v[0-9]+\.[0-9]+\.[0-9]+-([1-9][0-9]*)$ ]]; then
              candidate=${BASH_REMATCH[1]}
              decimal_gt "$candidate" 18446744073709551615 && continue
              if decimal_gt "$candidate" "$highest"; then
                highest=$candidate
                highest_tag=$previous_tag
              fi
            fi
          done < <(git tag --list 'linuxkit-platform-v*')
          if ! decimal_gt "$sequence" "$highest"; then
            echo "release sequence $sequence is not greater than existing maximum $highest" >&2
            exit 1
          fi
          if [[ -n "$highest_tag" ]]; then
            previous_commit=$(git rev-parse "refs/tags/$highest_tag^{commit}")
            if ! git merge-base --is-ancestor "$previous_commit" "$SOURCE_COMMIT"; then
              echo "release source must descend from the latest signed release" >&2
              exit 1
            fi
          fi
          source_date_epoch=$(git show -s --format=%ct "$SOURCE_COMMIT")
          {
            echo "version=$version"
            echo "sequence=$sequence"
            echo "source_date_epoch=$source_date_epoch"
          } >> "$GITHUB_OUTPUT"

      - name: Download unsigned release candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ${{ inputs.artifact_name }}
          path: release

      - name: Verify unsigned candidate before signing
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SEQUENCE: ${{ steps.identity.outputs.sequence }}
          PLATFORM_VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          python3 guest-platform/scripts/verify-platform-release.py \
            --asset-dir release \
            --expected-version "$PLATFORM_VERSION" \
            --expected-tag "$RELEASE_TAG" \
            --expected-sequence "$RELEASE_SEQUENCE" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-commit "$SOURCE_COMMIT" \
            --expected-source-date-epoch "$SOURCE_DATE_EPOCH"
          test "$(find release -maxdepth 1 -type f -name '*.licenses.json' | wc -l)" -eq 2
          for metadata in release/*.licenses.json release/*.spdx.json; do
            test -s "$metadata"
            ! grep -Fq '"NOASSERTION"' "$metadata"
          done
          for metadata in release/*.licenses.json; do
            grep -Fq '"publicationStatus": "READY"' "$metadata"
          done

      - name: Sign canonical manifests and checksums
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.signing_key }}
          EXPECTED_PUBLIC_KEY_BASE64: ${{ vars.LIGHTHOUSE_RUNTIME_ED25519_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_KEY:-}" || {
            echo "missing protected platform Ed25519 private key" >&2
            exit 1
          }
          test -n "${EXPECTED_PUBLIC_KEY_BASE64:-}" || {
            echo "missing pinned runtime Ed25519 public key" >&2
            exit 1
          }
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT HUP INT TERM
          umask 077
          printf '%s' "$SIGNING_KEY" > "$key_dir/private.pem"
          openssl pkey -in "$key_dir/private.pem" -check -noout
          openssl pkey -in "$key_dir/private.pem" -pubout \
            -out release/linuxkit-platform-ed25519-public-key.pem
          openssl pkey -in "$key_dir/private.pem" -pubout -outform DER \
            -out "$key_dir/public.der"
          test "$(wc -c < "$key_dir/public.der" | tr -d '[:space:]')" -eq 44
          test "$(od -An -tx1 -N12 "$key_dir/public.der" | tr -d '[:space:]')" = \
            '302a300506032b6570032100'
          expected_raw="$key_dir/expected-public.raw"
          printf '%s' "$EXPECTED_PUBLIC_KEY_BASE64" | base64 --decode > "$expected_raw"
          test "$(wc -c < "$expected_raw" | tr -d '[:space:]')" -eq 32
          test "$(base64 -w0 < "$expected_raw")" = "$EXPECTED_PUBLIC_KEY_BASE64"
          test "$(tail -c 32 "$key_dir/public.der" | base64 -w0)" = \
            "$EXPECTED_PUBLIC_KEY_BASE64"
          for manifest in release/*.runtime-manifest.json; do
            signature="${manifest%.json}.sig"
            openssl pkeyutl -sign -rawin -inkey "$key_dir/private.pem" \
              -in "$manifest" -out "$signature"
            openssl pkeyutl -verify -rawin -pubin \
              -inkey release/linuxkit-platform-ed25519-public-key.pem \
              -in "$manifest" -sigfile "$signature"
          done
          (
            cd release
            find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.sig \
              -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sed 's#  \./#  #'
          ) > release/SHA256SUMS
          openssl pkeyutl -sign -rawin -inkey "$key_dir/private.pem" \
            -in release/SHA256SUMS -out release/SHA256SUMS.sig
          openssl pkeyutl -verify -rawin -pubin \
            -inkey release/linuxkit-platform-ed25519-public-key.pem \
            -in release/SHA256SUMS -sigfile release/SHA256SUMS.sig

      - name: Upload immutable signed release candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: signed-lighthouse-guest-platform
          path: release/*
          if-no-files-found: error
          retention-days: 14
