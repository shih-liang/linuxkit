name: Build LightHouse ARM64 16K kernel and initramfs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'lighthouse-kernel-v*'

permissions:
  contents: write

env:
  KERNEL_VERSION: '6.12.59'
  BUSYBOX_VERSION: '1.36.1'
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    name: Build Linux 6.12.59 (ARM64 16 KiB)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out configuration
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc bison build-essential bzip2 cpio flex gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libelf-dev libssl-dev pahole python3 rsync xz-utils

      - name: Download and verify Linux source
        run: |
          set -eu
          base="https://cdn.kernel.org/pub/linux/kernel/v6.x"
          download_resumable() {
            url="$1"
            output="$2"
            attempt=1
            while :; do
              if curl --http1.1 --fail --location --continue-at - \
                --connect-timeout 30 --speed-time 60 --speed-limit 1024 \
                --retry 3 --retry-delay 5 --retry-max-time 120 \
                --retry-all-errors "$url" --output "$output"; then
                return 0
              fi
              if [ "$attempt" -ge 12 ]; then
                echo "download failed after $attempt resumable attempts: $url" >&2
                return 1
              fi
              echo "download interrupted; resuming in 5 seconds (attempt $attempt/12)" >&2
              attempt=$((attempt + 1))
              sleep 5
            done
          }
          download_resumable \
            "${base}/linux-${KERNEL_VERSION}.tar.xz" \
            "linux-${KERNEL_VERSION}.tar.xz"
          curl --http1.1 --fail --location --retry 8 --retry-delay 5 \
            --retry-max-time 300 --retry-all-errors \
            "${base}/sha256sums.asc" --output sha256sums.asc
          grep " linux-${KERNEL_VERSION}.tar.xz$" sha256sums.asc \
            | sha256sum --check --strict -
          tar --extract --file "linux-${KERNEL_VERSION}.tar.xz"
          cp config-aarch64 "linux-${KERNEL_VERSION}/.config"

      - name: Resolve Kconfig dependencies
        working-directory: linux-6.12.59
        run: |
          set -eu
          make ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" olddefconfig
          test "$(grep -E '^CONFIG_ARM64_16K_PAGES=y$' .config | wc -l)" -eq 1
          test "$(grep -E '^# CONFIG_ARM64_4K_PAGES is not set$' .config | wc -l)" -eq 1
          test "$(grep -E '^CONFIG_BLK_DEV_INITRD=y$' .config | wc -l)" -eq 1
          test "$(grep -E '^CONFIG_RD_GZIP=y$' .config | wc -l)" -eq 1
          if grep -E '^CONFIG_[A-Za-z0-9_]+=m$' .config; then
            echo 'The LightHouse kernel must not leave retained features as modules.' >&2
            exit 1
          fi
          # VZ supplies virtio devices; these physical PCI storage paths must stay off.
          if grep -E '^CONFIG_(SCSI_(HPSA|HISI_SAS|SMARTPQI|VIRTIO)|ATA=y|SATA_|PATA_|NVME_|BLK_DEV_NVME)=y$' .config; then
            echo 'A VZ-absent SCSI/SATA/NVMe driver is enabled.' >&2
            exit 1
          fi

      - name: Build kernel
        working-directory: linux-6.12.59
        run: |
          make -j"$(nproc)" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" Image

      - name: Build nativepipe-init and VZ-compatible initramfs
        run: |
          set -eu
          busybox_archive="busybox-${BUSYBOX_VERSION}.tar.bz2"
          curl --http1.1 --fail --location --retry 8 --retry-delay 5 \
            --retry-max-time 300 --retry-all-errors \
            "https://busybox.net/downloads/${busybox_archive}" \
            --output "${busybox_archive}"
          echo "b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314  ${busybox_archive}" \
            | sha256sum --check --strict -
          tar --extract --bzip2 --file "${busybox_archive}"

          make -C "busybox-${BUSYBOX_VERSION}" defconfig
          sed -i 's/^# CONFIG_STATIC is not set$/CONFIG_STATIC=y/' \
            "busybox-${BUSYBOX_VERSION}/.config"
          make -C "busybox-${BUSYBOX_VERSION}" oldconfig </dev/null
          make -C "busybox-${BUSYBOX_VERSION}" -j"$(nproc)" \
            ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE"

          cc -O2 -Wall -Wextra -Werror \
            nativepipe-init/nativepipe-init.c -o nativepipe-init-self-test
          ./nativepipe-init-self-test --self-test

          mkdir -p initramfs-root
          make -C "busybox-${BUSYBOX_VERSION}" \
            ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" \
            CONFIG_PREFIX="$PWD/initramfs-root" install
          "$CROSS_COMPILE"gcc -static -Os -Wall -Wextra -Werror \
            nativepipe-init/nativepipe-init.c \
            -o initramfs-root/sbin/nativepipe-init
          "$CROSS_COMPILE"strip initramfs-root/sbin/nativepipe-init
          "$CROSS_COMPILE"readelf -l initramfs-root/sbin/nativepipe-init \
            | if grep -q INTERP; then exit 1; fi

          ln -s sbin/nativepipe-init initramfs-root/init
          mkdir -p initramfs-root/dev initramfs-root/proc initramfs-root/sys \
            initramfs-root/run initramfs-root/newroot initramfs-root/tmp
          chmod 1777 initramfs-root/tmp
          (
            cd initramfs-root
            find . -print0 | LC_ALL=C sort -z \
              | cpio --null --create --format=newc --owner=0:0
          ) > "lighthouse-initramfs-${KERNEL_VERSION}-arm64.cpio"
          gzip --no-name --best --stdout \
            "lighthouse-initramfs-${KERNEL_VERSION}-arm64.cpio" \
            > "lighthouse-initramfs-${KERNEL_VERSION}-arm64.img"
          gzip --test "lighthouse-initramfs-${KERNEL_VERSION}-arm64.img"
          test "$(gzip --decompress --stdout \
            "lighthouse-initramfs-${KERNEL_VERSION}-arm64.img" \
            | dd bs=6 count=1 2>/dev/null)" = "070701"
          rm "lighthouse-initramfs-${KERNEL_VERSION}-arm64.cpio"

      - name: Package kernel and metadata
        run: |
          set -eu
          mkdir -p release
          cp "linux-${KERNEL_VERSION}/arch/arm64/boot/Image" \
            "release/lighthouse-linux-${KERNEL_VERSION}-arm64-16k.Image"
          test "$(dd if="release/lighthouse-linux-${KERNEL_VERSION}-arm64-16k.Image" \
            bs=1 skip=56 count=4 2>/dev/null)" = "ARMd"
          cp "lighthouse-initramfs-${KERNEL_VERSION}-arm64.img" release/
          cp "linux-${KERNEL_VERSION}/.config" release/config-aarch64
          cp "linux-${KERNEL_VERSION}/System.map" release/System.map
          tar --create --gzip --file \
            "lighthouse-linux-${KERNEL_VERSION}-arm64-16k.tar.gz" \
            -C release .
          mkdir -p artifact
          cp "lighthouse-linux-${KERNEL_VERSION}-arm64-16k.tar.gz" artifact/
          cp "release/lighthouse-linux-${KERNEL_VERSION}-arm64-16k.Image" artifact/
          cp "release/lighthouse-initramfs-${KERNEL_VERSION}-arm64.img" artifact/
          cp release/config-aarch64 release/System.map artifact/
          (cd artifact && sha256sum \
            "lighthouse-linux-${KERNEL_VERSION}-arm64-16k.tar.gz" \
            "lighthouse-linux-${KERNEL_VERSION}-arm64-16k.Image" \
            "lighthouse-initramfs-${KERNEL_VERSION}-arm64.img" \
            config-aarch64 System.map > SHA256SUMS)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-linux-6.12.59-arm64-16k
          path: artifact/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/lighthouse-kernel-v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-linux-6.12.59-arm64-16k
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          generate_release_notes: true
          files: |
            release/lighthouse-linux-6.12.59-arm64-16k.tar.gz
            release/lighthouse-linux-6.12.59-arm64-16k.Image
            release/lighthouse-initramfs-6.12.59-arm64.img
            release/config-aarch64
            release/System.map
            release/SHA256SUMS
