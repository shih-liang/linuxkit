name: Publish LightHouse kernel and initramfs

on:
  push:
    tags: ['lighthouse-kernel-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: New lighthouse-kernel-v<version>-<revision> tag
        required: true
        type: string
      kernel_release:
        description: Reuse kernel from this verified release (empty builds a new kernel)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: kernel-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      kernel_version: ${{ steps.release.outputs.kernel_version }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - name: Check out configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          kernel_version="$(tr -d '[:space:]' < KERNEL_VERSION)"
          [[ "$kernel_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          prefix="lighthouse-kernel-v${kernel_version}-"
          revision="${RELEASE_TAG#"$prefix"}"
          [[ "$RELEASE_TAG" != "$revision" && "$revision" =~ ^[1-9][0-9]*$ ]]
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists." >&2
            exit 1
          fi
          {
            echo "tag=$RELEASE_TAG"
            echo "kernel_version=$kernel_version"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"

  kernel:
    needs: prepare
    uses: ./.github/workflows/kernel-image.yml
    with:
      reuse_release: ${{ inputs.kernel_release || '' }}

  initramfs:
    needs: prepare
    uses: ./.github/workflows/build-initramfs.yml

  release:
    name: Publish verified prerelease
    needs: [prepare, kernel, initramfs]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      KERNEL_VERSION: ${{ needs.prepare.outputs.kernel_version }}
      RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download independent outputs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: lighthouse-*-arm64
          merge-multiple: true
          path: release

      - name: Package release
        run: |
          set -euo pipefail
          test "$(dd if="release/lighthouse-linux-${KERNEL_VERSION}-arm64-16k.Image" \
            bs=1 skip=56 count=4 2>/dev/null)" = ARMd
          gzip --test "release/lighthouse-initramfs-${KERNEL_VERSION}-arm64.img"
          for file in config-aarch64 System.map Module.symvers; do
            test -s "release/$file"
          done
          python3 adapters/validate.py
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@$source_date_epoch" \
            --owner=0 --group=0 --numeric-owner --format=gnu \
            --create --file=- -C release . | gzip --no-name --best \
            > "lighthouse-linux-${KERNEL_VERSION}-arm64-16k.tar.gz"
          mv "lighthouse-linux-${KERNEL_VERSION}-arm64-16k.tar.gz" release/
          tar --sort=name --mtime="@$source_date_epoch" \
            --owner=0 --group=0 --numeric-owner --format=gnu \
            --create --file=- -C adapters . | gzip --no-name --best \
            > "release/lighthouse-install-adapters-${KERNEL_VERSION}.tar.gz"
          (cd release && sha256sum * > SHA256SUMS)
          (cd release && sha256sum --check --strict SHA256SUMS)

      - name: Publish immutable prerelease
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace it." >&2
            exit 1
          fi
          if tagged_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null)"; then
            test "$tagged_sha" = "$GITHUB_SHA"
          elif [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "Release tag $RELEASE_TAG is missing." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
            --draft --generate-notes \
            --title "LightHouse Kernel ${KERNEL_VERSION}-${RELEASE_REVISION}" \
            release/*
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
